<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Mafia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #fff; }
        .nav { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #eee; }
        .active-tab { background: #3390ec; color: white; }
        .hidden { display: none; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        textarea { height: 80px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #3390ec; color: white; font-weight: bold; margin-top: 10px; }
        .card { background: #f4f4f5; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>
    <div class="nav">
        <button id="btn-main" class="tab-btn active-tab" onclick="showTab('main')">Игры</button>
        <button id="btn-admin" class="tab-btn hidden" onclick="showTab('admin')">Админ</button>
    </div>

    <div id="tab-main"><div id="games-grid" class="grid"></div></div>

    <div id="tab-admin" class="hidden">
        <h3>Настройка поста</h3>
        <input id="g-title" placeholder="Городская Мафия (заголовок)">
        <input id="g-type" placeholder="Вайбовый стол (тип стола)">
        <input id="g-date" placeholder="10 МАЯ, Воскресенье">
        <textarea id="g-desc" placeholder="Описание (Воскресенье на экваторе мая...)"></textarea>
        <input id="g-fits" placeholder="Подходит для (через запятую: Веселым, Красивым)">
        <input id="g-notfits" placeholder="Не подходит для (через запятую: Токсикам)">
        <input id="g-time" placeholder="18:00 | Четыре игры">
        <input id="g-cost" placeholder="800 рублей">
        <input id="g-master" placeholder="Актриса Таисия">
        <input id="g-loc" placeholder="Адрес локации">
        <input id="g-loc-url" placeholder="Ссылка на карты">
        <input id="g-photo" placeholder="Ссылка на фото (прямая ссылка .jpg)">
        <button onclick="saveGame()">Опубликовать в Telegram</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API = "https://mafia-k0kq.onrender.com";
        const ADMIN_ID = 2111239214;
        
        if (tg.initDataUnsafe.user?.id === ADMIN_ID) document.getElementById('btn-admin').classList.remove('hidden');

        async function load() {
            const r = await fetch(API + "/games");
            const games = await r.json();
            document.getElementById('games-grid').innerHTML = games.map(g => `
                <div class="card">
                    <b>${g.title}</b><br><small>${g.date_time}</small>
                </div>
            `).join('');
        }

        async function saveGame() {
            const data = {
                title: document.getElementById('g-title').value,
                table_type: document.getElementById('g-type').value,
                date_time: document.getElementById('g-date').value,
                description: document.getElementById('g-desc').value,
                fits: document.getElementById('g-fits').value,
                not_fits: document.getElementById('g-notfits').value,
                duration: document.getElementById('g-time').value,
                cost: document.getElementById('g-cost').value,
                master: document.getElementById('g-master').value,
                location: document.getElementById('g-loc').value,
                location_url: document.getElementById('g-loc-url').value,
                photo_url: document.getElementById('g-photo').value,
                max_slots: 15, players: [], reserve: []
            };
            await fetch(API + "/add_game", { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
            location.reload();
        }

        function showTab(t) {
            document.getElementById('tab-main').classList.add('hidden');
            document.getElementById('tab-admin').classList.add('hidden');
            document.getElementById('tab-' + t).classList.remove('hidden');
        }

        load();
    </script>
</body>
</html>
