<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafia Revolution</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-theme-bg-color: #ffffff; --tg-theme-button-color: #3390ec; }
        body { font-family: sans-serif; background: var(--tg-theme-bg-color); margin: 0; padding: 10px; }
        .nav { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; background: #eee; font-weight: bold; cursor: pointer; }
        .active-tab { background: var(--tg-theme-button-color); color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #f4f4f5; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.12); cursor: pointer; transition: transform .15s; }
        .card:active { transform: scale(0.97); }
        .card-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        .card-img-placeholder { width: 100%; aspect-ratio: 1/1; background: linear-gradient(135deg,#1a1a2e,#16213e); display: flex; align-items: center; justify-content: center; font-size: 36px; }
        .card-body { padding: 8px 10px 10px; }
        .card-body b { font-size: 13px; line-height: 1.3; display: block; }
        .card-body small { color: #888; font-size: 11px; }
        .card-badge { display: inline-block; margin-top: 5px; font-size: 10px; background: var(--tg-theme-button-color); color: white; border-radius: 6px; padding: 2px 6px; }
        .hidden { display: none; }
        label { display: block; font-size: 11px; color: #888; margin-top: 10px; }
        input, textarea { width: 100%; padding: 12px; margin-top: 3px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 80px; resize: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--tg-theme-button-color); color: white; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-danger { background: #e53935; }
        .btn-gray   { background: #888; }
        .btn-orange { background: #fb8c00; }
        .btn-sm { padding: 6px 10px; font-size: 11px; width: auto; margin-top: 0; border-radius: 6px; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:white; display:none; box-sizing:border-box; z-index:100; overflow-y:auto; }
        .modal.active { display: block; }
        .modal-hero { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        .modal-hero-placeholder { width: 100%; aspect-ratio: 1/1; background: linear-gradient(135deg,#1a1a2e,#16213e); display: flex; align-items: center; justify-content: center; font-size: 64px; }
        .modal-back { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.45); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; width: auto; margin: 0; cursor: pointer; z-index: 10; }
        .modal-inner { padding: 15px; }
        .p-table { width: 100%; border-collapse: collapse; font-size: 0.85em; margin-top: 8px; }
        .p-table td { padding: 7px 4px; border-bottom: 1px solid #eee; }
        .upload-box { margin-top: 5px; border: 2px dashed #ccc; border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; position: relative; }
        .upload-box input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; padding: 0; margin: 0; }
        .upload-preview { width: 100%; border-radius: 8px; margin-top: 8px; display: none; aspect-ratio: 1/1; object-fit: cover; }

        /* Список игр в админке */
        .admin-game-item {
            display: flex; align-items: center; gap: 10px;
            background: #f4f4f5; border-radius: 12px;
            padding: 10px; margin-bottom: 10px;
        }
        .admin-game-item img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .admin-game-placeholder { width: 50px; height: 50px; border-radius: 8px; background: linear-gradient(135deg,#1a1a2e,#16213e); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .admin-game-info { flex: 1; min-width: 0; }
        .admin-game-info b { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-game-info small { color: #888; font-size: 11px; }
        .admin-game-btns { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }

        .section-title { font-weight: bold; font-size: 15px; margin: 15px 0 8px; }
        .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>

<div class="nav">
    <button id="btn-main"  class="tab-btn active-tab" onclick="showTab('main')">Игры</button>
    <button id="btn-me"    class="tab-btn"            onclick="showTab('me')">Профиль</button>
    <button id="btn-admin" class="tab-btn"            onclick="showTab('admin')">Админ</button>
</div>

<!-- ══ ИГРЫ ══ -->
<div id="tab-main">
    <div id="games-grid" class="grid">Загрузка...</div>
</div>

<!-- ══ ПРОФИЛЬ ══ -->
<div id="tab-me" class="hidden">
    <h3>Мой профиль</h3>
    <input id="u-name" placeholder="Ваше Имя">
    <input id="u-nick" placeholder="Игровой Ник (необязательно)">
    <button onclick="saveProfile()">Сохранить данные</button>
    <div id="my-records" style="margin-top:20px;"></div>
</div>

<!-- ══ АДМИН ══ -->
<div id="tab-admin" class="hidden">

    <!-- Список существующих игр -->
    <div class="section-title">📋 Существующие игры</div>
    <div id="admin-games-list">Загрузка...</div>

    <hr class="divider">

    <!-- Форма создания/редактирования -->
    <div class="section-title" id="form-title">➕ Новая игра</div>
    <input type="hidden" id="edit-game-id">

    <label>Дата (10 мая)</label><input id="g-date">
    <label>Тип стола</label><input id="g-type">
    <label>Название игры</label><input id="g-title">
    <label>Описание</label><textarea id="g-desc"></textarea>
    <label>Подходит (через запятую)</label><input id="g-fits">
    <label>Не подходит (через запятую)</label><input id="g-notfits">
    <label>День недели</label><input id="g-day">
    <label>Время начала</label><input id="g-time">
    <label>Количество игр</label><input id="g-count">
    <label>Цена</label><input id="g-cost">
    <label>Ведущий</label><input id="g-master">
    <label>Название локации</label><input id="g-loc-name">
    <label>Адрес</label><input id="g-loc-addr">
    <label>Ссылка на карту</label><input id="g-loc-url">

    <label>Фото (с устройства)</label>
    <div class="upload-box">
        <input type="file" id="g-photo-file" accept="image/*" onchange="uploadPhoto(this)">
        <div id="upload-placeholder">📷 Нажмите чтобы выбрать фото<br><small style="color:#aaa;">рекомендуется квадратное 1:1</small></div>
        <img id="upload-preview" class="upload-preview">
    </div>
    <small id="g-photo-status" style="color:gray; display:block; margin-top:4px;"></small>
    <input type="hidden" id="g-photo">

    <button id="publish-btn" onclick="saveGame()">🚀 ОПУБЛИКОВАТЬ</button>
    <button class="btn-gray" onclick="clearAdmin()">🗑 Очистить поля</button>
</div>

<!-- ══ МОДАЛКА ИГРЫ ══ -->
<div id="game-modal" class="modal">
    <button class="modal-back" onclick="closeModal()">⬅ Назад</button>
    <div id="modal-content"></div>
</div>

<script>
    const tg  = window.Telegram.WebApp;
    const API = "https://mafia-k0kq.onrender.com";
    const MY_ID  = tg.initDataUnsafe?.user?.id || 12345;
    const MY_TG  = tg.initDataUnsafe?.user?.username ? "@" + tg.initDataUnsafe.user.username : "нет";

    let games   = [];
    let profile = JSON.parse(localStorage.getItem('m_prof')) || null;

    if (profile) {
        document.getElementById('u-name').value = profile.name;
        document.getElementById('u-nick').value = profile.nick || '';
    }

    async function loadData() {
        try {
            const r = await fetch(API + "/games");
            games = await r.json();
            renderGames();
            renderMyRecords();
            renderAdminGames();
        } catch (e) {
            document.getElementById('games-grid').innerText = "Ошибка связи";
        }
    }

    /* ── Карточки игр ── */
    function renderGames() {
        if (!games.length) {
            document.getElementById('games-grid').innerHTML = "<p>Игр нет</p>";
            return;
        }
        document.getElementById('games-grid').innerHTML = games.map(g => {
            const imgBlock = g.photo_url
                ? `<img class="card-img" src="${g.photo_url}" alt="фото" loading="lazy">`
                : `<div class="card-img-placeholder">🎭</div>`;
            const slots = g.max_slots - g.players.length;
            return `
                <div class="card" onclick="openGame(${g.id})">
                    ${imgBlock}
                    <div class="card-body">
                        <b>${g.title}</b>
                        <small>${g.game_date}</small><br>
                        <span class="card-badge">${slots > 0 ? `${slots} мест` : 'Резерв'}</span>
                    </div>
                </div>`;
        }).join('');
    }

    /* ── Список игр в админке ── */
    function renderAdminGames() {
        const el = document.getElementById('admin-games-list');
        if (!games.length) { el.innerHTML = "<p style='color:#aaa;'>Игр пока нет</p>"; return; }
        el.innerHTML = games.map(g => `
            <div class="admin-game-item">
                ${g.photo_url
                    ? `<img src="${g.photo_url}" alt="">`
                    : `<div class="admin-game-placeholder">🎭</div>`}
                <div class="admin-game-info">
                    <b>${g.title}</b>
                    <small>${g.game_date} · ${g.players.length}/${g.max_slots} игроков</small>
                </div>
                <div class="admin-game-btns">
                    <button class="btn-orange btn-sm" onclick="startEditGame(${g.id})">✏️ Ред.</button>
                    <button class="btn-danger btn-sm" onclick="deleteGame(${g.id})">🗑 Удал.</button>
                </div>
            </div>`).join('');
    }

    /* ── Открытие игры ── */
    function openGame(id) {
        const g = games.find(x => x.id === id);
        if (!g) return;
        const signed = [...g.players, ...g.reserve].some(p => p.user_id === MY_ID);

        const heroBlock = g.photo_url
            ? `<img class="modal-hero" src="${g.photo_url}" alt="фото">`
            : `<div class="modal-hero-placeholder">🎭</div>`;

        const playerRows = g.players.map((p, i) => {
            const nick = p.nickname && p.nickname.trim() ? ` <span style="color:#888;font-size:11px;">«${p.nickname}»</span>` : '';
            const tg   = p.tg_profile !== 'нет' ? `<span style="color:#3390ec;font-size:11px;"> ${p.tg_profile}</span>` : '';
            return `<tr><td style="color:#aaa;">${i+1}.</td><td>${p.name}${nick}${tg}</td></tr>`;
        }).join('');

        document.getElementById('modal-content').innerHTML = `
            ${heroBlock}
            <div class="modal-inner">
                <h2 style="margin-top:8px;">${g.title}</h2>
                <p style="color:#555;">🕒 ${g.game_date}, ${g.game_day} · ${g.time_start}</p>
                <p>${g.description}</p>
                <hr>
                <b>Участники (${g.players.length}/${g.max_slots}):</b>
                <table class="p-table">${playerRows}</table>
                ${g.reserve.length ? `<p style="color:#888;font-size:12px;">Резерв: ${g.reserve.length} чел.</p>` : ''}
                ${!signed
                    ? `<button onclick="reg(${g.id})">✅ Записаться</button>`
                    : `<button class="btn-danger" onclick="canc(${g.id})">❌ Отменить запись</button>`}
            </div>`;

        document.getElementById('game-modal').classList.add('active');
    }

    /* ── Начать редактирование ── */
    function startEditGame(id) {
        const g = games.find(x => x.id === id);
        if (!g) return;

        document.getElementById('edit-game-id').value = g.id;
        document.getElementById('form-title').textContent = '✏️ Редактирование игры';
        document.getElementById('publish-btn').textContent = '💾 СОХРАНИТЬ ИЗМЕНЕНИЯ';

        document.getElementById('g-date').value     = g.game_date;
        document.getElementById('g-type').value     = g.table_type;
        document.getElementById('g-title').value    = g.title;
        document.getElementById('g-desc').value     = g.description;
        document.getElementById('g-fits').value     = g.fits;
        document.getElementById('g-notfits').value  = g.not_fits;
        document.getElementById('g-day').value      = g.game_day;
        document.getElementById('g-time').value     = g.time_start;
        document.getElementById('g-count').value    = g.games_count;
        document.getElementById('g-cost').value     = g.cost;
        document.getElementById('g-master').value   = g.master;
        document.getElementById('g-loc-name').value = g.location_name;
        document.getElementById('g-loc-addr').value = g.location_address;
        document.getElementById('g-loc-url').value  = g.location_url;
        document.getElementById('g-photo').value    = g.photo_url || '';

        if (g.photo_url) {
            const preview = document.getElementById('upload-preview');
            preview.src = g.photo_url;
            preview.style.display = 'block';
            document.getElementById('upload-placeholder').style.display = 'none';
            document.getElementById('g-photo-status').textContent = '✅ Текущее фото';
            document.getElementById('g-photo-status').style.color = 'green';
        }

        // Прокручиваем к форме
        document.getElementById('form-title').scrollIntoView({behavior: 'smooth'});
    }

    /* ── Удалить игру ── */
    async function deleteGame(id) {
        if (!confirm('Удалить эту игру? Пост в Telegram тоже будет удалён.')) return;
        try {
            await fetch(API + `/delete_game/${id}`, {method: 'DELETE'});
            await loadData();
        } catch (e) {
            alert('Ошибка удаления: ' + e.message);
        }
    }

    /* ── Сохранить игру (новая или редактирование) ── */
    async function saveGame() {
        const photoUrl  = document.getElementById('g-photo').value;
        const photoFile = document.getElementById('g-photo-file').files.length;
        const editId    = document.getElementById('edit-game-id').value;

        if (photoFile > 0 && !photoUrl) return alert("⏳ Подождите, фото ещё загружается...");

        const data = {
            game_date:        document.getElementById('g-date').value,
            table_type:       document.getElementById('g-type').value,
            title:            document.getElementById('g-title').value,
            description:      document.getElementById('g-desc').value,
            fits:             document.getElementById('g-fits').value,
            not_fits:         document.getElementById('g-notfits').value,
            game_day:         document.getElementById('g-day').value,
            time_start:       document.getElementById('g-time').value,
            games_count:      document.getElementById('g-count').value,
            cost:             document.getElementById('g-cost').value,
            master:           document.getElementById('g-master').value,
            location_name:    document.getElementById('g-loc-name').value,
            location_address: document.getElementById('g-loc-addr').value,
            location_url:     document.getElementById('g-loc-url').value,
            photo_url:        photoUrl
        };

        if (!data.title) return alert("Укажите название игры!");

        try {
            let res;
            if (editId) {
                // Редактирование
                res = await fetch(API + `/edit_game/${editId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
            } else {
                // Новая игра
                res = await fetch(API + "/add_game", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
            }

            if (!res.ok) {
                const err = await res.text();
                return alert("❌ Ошибка сервера: " + err);
            }

            alert(editId ? "✅ Игра обновлена!" : "✅ Игра опубликована!");
            clearAdmin();
            showTab('main');
            loadData();
        } catch (e) {
            alert("❌ Ошибка соединения: " + e.message);
        }
    }

    /* ── Загрузка фото ── */
    async function uploadPhoto(input) {
        const file = input.files[0];
        if (!file) return;

        const status      = document.getElementById('g-photo-status');
        const preview     = document.getElementById('upload-preview');
        const placeholder = document.getElementById('upload-placeholder');
        const hiddenInput = document.getElementById('g-photo');

        hiddenInput.value = '';
        status.textContent = "⏳ Загрузка фото...";
        status.style.color = "gray";

        const reader = new FileReader();
        reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            placeholder.style.display = 'none';
        };
        reader.readAsDataURL(file);

        const formData = new FormData();
        formData.append("file", file);
        try {
            const res  = await fetch(API + "/upload_photo", {method: "POST", body: formData});
            const data = await res.json();
            hiddenInput.value = data.photo_url;
            status.textContent = "✅ Фото загружено!";
            status.style.color = "green";
        } catch (e) {
            status.textContent = "❌ Ошибка загрузки: " + e.message;
            status.style.color = "red";
        }
    }

    /* ── Очистка формы ── */
    function clearAdmin() {
        ['g-date','g-type','g-title','g-desc','g-fits','g-notfits',
         'g-day','g-time','g-count','g-cost','g-master',
         'g-loc-name','g-loc-addr','g-loc-url','g-photo','edit-game-id'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('g-photo-file').value = '';
        document.getElementById('upload-preview').style.display = 'none';
        document.getElementById('upload-placeholder').style.display = 'block';
        document.getElementById('g-photo-status').textContent = '';
        document.getElementById('form-title').textContent = '➕ Новая игра';
        document.getElementById('publish-btn').textContent = '🚀 ОПУБЛИКОВАТЬ';
    }

    /* ── Профиль ── */
    function saveProfile() {
        const name = document.getElementById('u-name').value.trim();
        const nick = document.getElementById('u-nick').value.trim();
        if (!name) return alert("Имя обязательно");
        profile = {name, nick};
        localStorage.setItem('m_prof', JSON.stringify(profile));
        alert("Профиль сохранен!");
    }

    function renderMyRecords() {
        const my = games.filter(g => [...g.players, ...g.reserve].some(p => p.user_id === MY_ID));
        document.getElementById('my-records').innerHTML = my.length
            ? my.map(g => `
                <div class="card" style="margin-top:10px; display:flex; align-items:center; gap:10px; padding:10px;">
                    ${g.photo_url
                        ? `<img src="${g.photo_url}" style="width:54px;height:54px;border-radius:8px;object-fit:cover;">`
                        : `<div style="width:54px;height:54px;border-radius:8px;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:22px;">🎭</div>`}
                    <div>
                        <b>${g.title}</b><br>
                        <small>${g.game_date}</small><br>
                        <button class="btn-danger" style="padding:5px 10px;font-size:11px;width:auto;margin-top:4px;" onclick="canc(${g.id})">Отменить</button>
                    </div>
                </div>`).join('')
            : "<p style='color:#aaa;'>Записей нет</p>";
    }

    async function reg(id) {
        if (!profile) { showTab('me'); return alert("Заполните профиль!"); }
        await fetch(API + `/register/${id}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: profile.name, nickname: profile.nick || '', tg_profile: MY_TG, user_id: MY_ID})
        });
        closeModal(); loadData();
    }

    async function canc(id) {
        await fetch(API + `/cancel/${id}?user_id=${MY_ID}`, {method: 'POST'});
        closeModal(); loadData();
    }

    function showTab(t) {
        ['main','me','admin'].forEach(x => {
            document.getElementById('tab-'+x).classList.add('hidden');
            document.getElementById('btn-'+x).classList.remove('active-tab');
        });
        document.getElementById('tab-'+t).classList.remove('hidden');
        document.getElementById('btn-'+t).classList.add('active-tab');
    }

    function closeModal() {
        document.getElementById('game-modal').classList.remove('active');
    }

    loadData();
</script>
</body>
</html>
