<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafia Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #fff; margin: 0; }
        .nav { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #eee; font-weight: bold; }
        .active-tab { background: #3390ec; color: white; }
        .hidden { display: none; }
        .form-section { background: #f4f4f5; padding: 15px; border-radius: 12px; margin-bottom: 80px; }
        label { display: block; font-size: 12px; color: #666; margin-top: 10px; }
        input, textarea { width: 100%; padding: 12px; margin-top: 4px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 100px; resize: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #f4f4f5; padding: 10px; border-radius: 10px; }
        .fixed-btn { position: fixed; bottom: 10px; left: 10px; right: 10px; z-index: 10; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #3390ec; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="nav">
        <button id="btn-main" class="tab-btn active-tab" onclick="showTab('main')">Игры</button>
        <button id="btn-admin" class="tab-btn hidden" onclick="showTab('admin')">Админ</button>
    </div>

    <div id="tab-main"><div id="games-grid" class="grid"></div></div>

    <div id="tab-admin" class="hidden">
        <div class="form-section">
            <h3>Конструктор поста</h3>
            
            <label>Дата (напр. 10 мая)</label>
            <input id="g-date" placeholder="10 мая">

            <label>Тип стола (напр. Вайбовый стол)</label>
            <input id="g-type" placeholder="Вайбовый стол">

            <label>Название игры (напр. Городская Мафия)</label>
            <input id="g-title" placeholder="Городская Мафия">

            <label>Описание (основной текст)</label>
            <textarea id="g-desc" placeholder="Воскресенье на экваторе мая..."></textarea>

            <label>Подходит для (через запятую)</label>
            <input id="g-fits" placeholder="Красивым, Веселым, Остроумным">

            <label>Не подходит для (через запятую)</label>
            <input id="g-notfits" placeholder="Токсикам">

            <label>День недели</label>
            <input id="g-day" placeholder="Воскресенье">

            <label>Время начала</label>
            <input id="g-time" placeholder="18:00">

            <label>Количество игр</label>
            <input id="g-count" placeholder="Четыре игры">

            <label>Цена</label>
            <input id="g-cost" placeholder="800 рублей">

            <label>Ведущий</label>
            <input id="g-master" placeholder="Актриса Таисия">

            <label>Название локации</label>
            <input id="g-loc-name" placeholder="Локация">

            <label>Адрес</label>
            <input id="g-loc-addr" placeholder="Парадная, Малые Каменщики 16...">

            <label>Ссылка на карту (URL)</label>
            <input id="g-loc-url" placeholder="https://yandex.ru/maps/...">

            <label>Ссылка на фото (1:1)</label>
            <input id="g-photo" placeholder="https://...">

            <div class="fixed-btn">
                <button onclick="saveGame()">ОПУБЛИКОВАТЬ ПОСТ</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const API = "https://mafia-k0kq.onrender.com";
        const ADMIN_ID = 2111239214;
        
        if (tg.initDataUnsafe.user?.id === ADMIN_ID) document.getElementById('btn-admin').classList.remove('hidden');

        async function load() {
            const r = await fetch(API + "/games");
            const games = await r.json();
            document.getElementById('games-grid').innerHTML = games.map(g => `
                <div class="card" onclick="alert('Игра создана и опубликована!')">
                    <b>${g.title}</b><br><small>${g.game_date}</small>
                </div>
            `).join('') || "Игр пока нет";
        }

        async function saveGame() {
            const data = {
                game_date: document.getElementById('g-date').value,
                table_type: document.getElementById('g-type').value,
                title: document.getElementById('g-title').value,
                description: document.getElementById('g-desc').value,
                fits: document.getElementById('g-fits').value,
                not_fits: document.getElementById('g-notfits').value,
                game_day: document.getElementById('g-day').value,
                time_start: document.getElementById('g-time').value,
                games_count: document.getElementById('g-count').value,
                cost: document.getElementById('g-cost').value,
                master: document.getElementById('g-master').value,
                location_name: document.getElementById('g-loc-name').value,
                location_address: document.getElementById('g-loc-addr').value,
                location_url: document.getElementById('g-loc-url').value,
                photo_url: document.getElementById('g-photo').value,
                max_slots: 15, players: [], reserve: []
            };
            
            tg.MainButton.setText("ПУБЛИКАЦИЯ...").show();
            await fetch(API + "/add_game", { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
            tg.MainButton.hide();
            location.reload();
        }

        function showTab(t) {
            document.getElementById('tab-main').classList.add('hidden');
            document.getElementById('tab-admin').classList.add('hidden');
            document.getElementById('tab-' + t).classList.remove('hidden');
        }

        load();
    </script>
</body>
</html>
